
name: Android Mobile Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ui-tests:
    name: Appium Android UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APPIUM_SERVER_URL: http://127.0.0.1:4723
      DEVICE_NAME: emulator-5554
      UDID: emulator-5554

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Appium
        run: |
          npm install --global appium@3.1.2
          appium driver install uiautomator2@6.7.1

      - name: Download QuizMaster APK and test dataset
        run: |
          mkdir -p test_data reports

          curl -fL \
            "https://github.com/Kevinnnhub/quizmaster/releases/download/v0.1.1/app-release.apk" \
            -o app-release.apk

          curl -fL \
            "https://raw.githubusercontent.com/Kevinnnhub/quizmaster/main/assets/questions.json" \
            -o test_data/questions.json

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android automation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash .github/scripts/run-android-tests.sh

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quizmaster-automation-test-evidence
          path: |
            reports/pytest-report.html
            reports/junit-results.xml
            reports/ci-home-screen.png
            reports/ci-page-source.xml
            screenshots/*.png
            appium.log
          if-no-files-found: warn
          retention-days: 14
